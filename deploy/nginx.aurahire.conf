# AuraHire - nginx server block appended to the IAMS reverse proxy.
#
# Since aurahire-prod was destroyed (2026-05-20), aurahire co-tenants on the
# iams-backend droplet at 167.71.217.44. The IAMS stack (deploy_default
# docker network) owns ports 80/443 via the iams-nginx container, so the
# original deploy/Caddyfile no longer applies - these blocks get appended
# to /opt/iams/deploy/nginx.vps.conf (which is bind-mounted into iams-nginx
# at /etc/nginx/conf.d/default.conf).
#
# Why HOST=172.18.0.1 instead of 127.0.0.1:
#   The aurahire API runs via PM2 on the host. iams-nginx is in a container
#   on the deploy_default network whose gateway is 172.18.0.1 (the host's
#   address on that bridge). Binding the API to 172.18.0.1:3333 exposes it
#   to containers on the bridge but not to the public internet. UFW
#   additionally allows only `from 172.18.0.0/16 to any port 3333` so even
#   if a misconfig binds the API to 0.0.0.0, the public still can't reach
#   it.
#
# To install on the droplet:
#   1) Append this file to /opt/iams/deploy/nginx.vps.conf in place
#      (do NOT use `mv` - it breaks the bind-mount inode):
#        cat deploy/nginx.aurahire.conf >> /opt/iams/deploy/nginx.vps.conf
#   2) Validate + reload:
#        docker exec iams-nginx nginx -t
#        docker exec iams-nginx nginx -s reload
#
# TLS cert lives in the IAMS certbot volume (deploy_certbot_certs); it was
# obtained via certbot certonly --webroot through the existing
# /.well-known/acme-challenge handler in nginx.vps.conf. Renewal runs via
# the aurahire-certbot.timer systemd unit on the host (twice daily).

limit_req_zone $binary_remote_addr zone=aurahire_api:10m rate=60r/s;

server {
    listen 80;
    listen [::]:80;
    server_name 167-71-217-44.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 167-71-217-44.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/167-71-217-44.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/167-71-217-44.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resume uploads (PDF/DOCX) are bounded at ~5 MB; 10M leaves room for
    # multipart overhead + future formats without a 413 from nginx before
    # the API even sees the request.
    client_max_body_size 10M;

    # Socket.io path - long-lived connections, Socket.io pings keep them
    # alive. No read timeout because the upstream owns lifecycle.
    location /socket.io/ {
        proxy_pass http://172.18.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Default REST + Swagger. 60s timeout for resume parsing + AI scoring
    # (cold-start OpenAI calls can take 30-40s).
    location / {
        limit_req zone=aurahire_api burst=120 nodelay;

        proxy_pass http://172.18.0.1:3333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
