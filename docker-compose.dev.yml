# AuraHire - Local Development Services
#
# Run from repo root:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#   docker compose -f docker-compose.dev.yml logs -f
#
# Provides ephemeral local services for `pnpm dev`:
#   - Mailpit:  SMTP catcher for transactional email in dev
#   - Redis:    cache + queue + throttle store for apps/api
#
# Production uses Resend for email and a Redis container on the Digital Ocean Droplet
# (see deploy/docker-compose.prod.yml).
# Docker Desktop must be running.

name: aurahire-dev

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: aurahire-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP - apps/api connects here in dev (NODE_ENV=development)
      - "8025:8025" # Web UI - open http://localhost:8025 to view captured emails
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: "/data/mailpit.db"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8025/api/v1/info",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: aurahire-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # apps/api connects here as REDIS_URL=redis://localhost:6379
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mailpit-data:
  redis-data:
