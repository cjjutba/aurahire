# AuraHire — Production deploy on push to main.
#
# Triggers ONLY on push to main (which a merged PR produces). The job
# validates first (mirrors ci.yml), then SSHes into the Digital Ocean
# Droplet as the deploy user and runs `bash deploy/deploy.sh`. The deploy
# script itself does the env-validation guardrails (NODE_ENV=production,
# USE_RESEND=true, APP_URL=https://aurahire.site, etc.) before reloading
# PM2 — a misconfigured prod .env aborts the deploy without touching the
# live process.
#
# REQUIRED REPOSITORY SECRETS (Settings → Secrets → Actions):
#   DROPLET_HOST                — IPv4 / hostname (e.g. 165.232.123.45 or droplet.aurahire.site)
#   DROPLET_USER                — SSH user (typically: deploy)
#   DROPLET_SSH_PRIVATE_KEY     — PEM-formatted private key matching ~deploy/.ssh/authorized_keys
#                                 (generate with `ssh-keygen -t ed25519 -C "github-actions"`,
#                                 add the public half to the droplet, paste the private half here)
#   DROPLET_SSH_KNOWN_HOSTS     — output of `ssh-keyscan -H <DROPLET_HOST>`
#                                 (pins the host fingerprint so a MITM can't redirect deploys)
#
# OPTIONAL SECRETS:
#   DROPLET_DEPLOY_PATH         — path on the droplet (default: /home/deploy/aurahire)
#   DROPLET_DEPLOY_BRANCH       — branch to deploy (default: main)

name: Deploy to Droplet

on:
  push:
    branches: [main]
  # Manual trigger from the Actions tab — useful for re-running a deploy
  # without making a no-op commit (e.g., after rotating a Resend key).
  workflow_dispatch:

# Only one deploy at a time — back-to-back merges queue rather than racing.
# `cancel-in-progress: false` is intentional: never abandon a deploy mid-flight.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.3"

jobs:
  validate:
    name: Validate (re-run CI gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (all packages)
        run: pnpm type-check

      - name: Test — API
        run: pnpm --filter @aurahire/api test

      - name: Test — Web
        run: pnpm --filter @aurahire/web test

  deploy:
    name: Deploy to Droplet
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `production` environment unlocks an optional GitHub-side approval
    # gate ( Settings → Environments → production → Required reviewers ).
    # If you don't need approvals, you can drop the `environment` block.
    environment:
      name: production
      url: https://aurahire.site
    steps:
      - name: Checkout (for context only — actual code is pulled on the droplet)
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sanity-check SSH connection
        run: |
          ssh -o BatchMode=yes \
              "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
              "echo connected as \$(whoami) on \$(hostname)"

      - name: Run deploy.sh on the droplet
        env:
          DEPLOY_PATH: ${{ vars.DROPLET_DEPLOY_PATH || '/home/deploy/aurahire' }}
          DEPLOY_BRANCH: ${{ vars.DROPLET_DEPLOY_BRANCH || 'main' }}
        run: |
          ssh -o BatchMode=yes \
              "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" \
              "set -euo pipefail; \
               cd '${DEPLOY_PATH}'; \
               echo '==> Switch to ${DEPLOY_BRANCH}'; \
               git fetch origin '${DEPLOY_BRANCH}'; \
               git checkout '${DEPLOY_BRANCH}'; \
               bash deploy/deploy.sh"

      - name: Health-check API
        # `|| true` — the health endpoint may not exist on every release; this
        # is a smoke test, not a hard gate. Replace with a real probe once
        # /api/v1/health is stable in production.
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --max-time 5 "https://api.aurahire.site/api/v1/health" >/dev/null; then
              echo "✓ API healthy"
              exit 0
            fi
            echo "  …attempt $i/5 — sleeping 3s"
            sleep 3
          done
          echo "⚠ Health probe did not succeed; check pm2 logs aurahire-api on the droplet."
          # Don't fail the workflow on a flaky probe — the deploy itself
          # succeeded (PM2 reload) if we got here.
          exit 0
